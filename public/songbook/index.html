<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111318" />
  <title>Guitar Lab — Stage 1</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --line: #2b303b;
      --text: #f5f7fb;
      --muted: #9ba5b4;
      --accent: #f4c95d;
      --accent-2: #8bc6ff;
      --danger: #ff8d8d;
      --shadow: 0 18px 55px rgba(0,0,0,.28);
      --song-size: 20px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; min-height: 0; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }

    .app {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      transition: grid-template-columns .2s ease;
    }

    .app.sidebar-collapsed {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    .app.sidebar-collapsed .sidebar {
      opacity: 0;
      pointer-events: none;
      border-right-color: transparent;
    }

    .sidebar {
      min-width: 0;
      background: #12151b;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      z-index: 5;
      overflow: hidden;
      transition: opacity .16s ease, transform .2s ease, border-color .16s ease;
    }

    .brand {
      padding: 22px 20px 15px;
      border-bottom: 1px solid var(--line);
    }
    .brand-kicker {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .brand-title {
      margin-top: 5px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.025em;
    }
    .brand-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .search-wrap { padding: 14px 14px 8px; }
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      outline: none;
    }
    .search:focus { border-color: #4b5567; }

    .song-list {
      list-style: none;
      margin: 0;
      padding: 6px 8px 14px;
      overflow: auto;
      flex: 1;
    }
    .song-item button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 11px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    .song-item button:hover { background: var(--panel); }
    .song-item.active button {
      background: var(--panel-2);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .song-title-small { font-weight: 750; }
    .song-artist-small {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .main {
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      position: relative;
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: rgba(15,17,21,.94);
      backdrop-filter: blur(14px);
      padding: 17px 22px 15px;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 18px;
      align-items: center;
      z-index: 4;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .menu-btn {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      flex: 0 0 auto;
    }
    .song-heading { min-width: 0; }
    .song-heading h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-heading .artist {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .segmented, .control-group {
      display: inline-flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .segmented button, .control-group button {
      border: 0;
      background: transparent;
      padding: 8px 10px;
      cursor: pointer;
      color: var(--muted);
    }
    .segmented button:hover, .control-group button:hover { color: var(--text); background: #222733; }
    .segmented button.active { color: #101217; background: var(--accent); font-weight: 800; }
    .control-group .value {
      min-width: 64px;
      text-align: center;
      padding: 7px 8px;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      font-size: 12px;
      color: var(--text);
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .meta-pill strong { color: var(--text); }

    .reader {
      min-height: 0;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 34px clamp(24px, 5vw, 80px) 110px;
    }

    .song-sheet {
      width: min(900px, 100%);
      margin: 0 auto;
      font-size: var(--song-size);
      line-height: 1.5;
    }

    .section {
      margin: 0 0 34px;
    }
    .section-title {
      margin: 0 0 13px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .line-block { margin: 0 0 17px; }
    .lyric-line {
      min-height: 1.55em;
      letter-spacing: .005em;
      word-spacing: .025em;
    }
    .lyric-line .unit {
      display: inline-flex;
      flex-direction: column;
      vertical-align: bottom;
      margin-right: .18em;
    }
    .chord {
      min-height: 1.1em;
      color: var(--accent-2);
      font-weight: 850;
      font-size: .78em;
      line-height: 1.05;
      letter-spacing: .02em;
    }
    .word { white-space: pre-wrap; }

    .ipa {
      margin-top: 3px;
      color: #cbd3df;
      font-family: "Charis SIL", "Doulos SIL", "Noto Serif", serif;
      font-size: .86em;
      line-height: 1.45;
      letter-spacing: .015em;
    }

    .mode-lyrics .chord, .mode-lyrics .ipa { display: none; }
    .mode-chords .ipa { display: none; }
    .mode-ipa .chord { display: none; }

    .empty {
      padding: 50px 0;
      color: var(--muted);
      text-align: center;
    }

    .playerbar {
      border-top: 1px solid var(--line);
      background: rgba(18,21,27,.96);
      backdrop-filter: blur(16px);
      padding: 10px 16px;
      display: grid;
      grid-template-columns: auto minmax(190px, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      z-index: 4;
    }
    .player-actions { display: flex; align-items: center; gap: 8px; }
    .btn {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
    }
    .btn:hover { background: #262c37; }
    .btn.primary { background: var(--accent); color: #111318; border-color: transparent; font-weight: 800; }
    .btn.primary:hover { filter: brightness(1.04); }

    .file-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px dashed #465063;
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .file-label:hover { color: var(--text); border-color: #657086; }
    .file-label input { display: none; }

    audio { width: 100%; height: 36px; }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    input[type="range"] { accent-color: var(--accent); }

    .hint {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .backdrop { display: none; }

    @media (max-width: 980px) {
      .app { grid-template-columns: 250px minmax(0,1fr); }
      .topbar { grid-template-columns: 1fr; align-items: start; }
      .toolbar { justify-content: flex-start; }
      .playerbar { grid-template-columns: auto 1fr; }
      .playerbar .slider-group, .playerbar .hint { grid-column: span 1; }
    }

    @media (max-width: 760px) {
      body { overflow: hidden; }
      .app { display: block; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(84vw, 320px);
        transform: translateX(-102%);
        transition: transform .2s ease;
        box-shadow: var(--shadow);
      }
      .sidebar.open { transform: translateX(0); }
      .app.sidebar-collapsed .sidebar {
        opacity: 1;
        pointer-events: auto;
        border-right-color: var(--line);
      }
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.45);
        z-index: 3;
      }
      .backdrop.show { display: block; }
      .main { height: 100vh; height: 100dvh; min-height: 0; }
      .topbar { padding: 12px; gap: 10px; }
      .song-heading h1 { font-size: 21px; }
      .toolbar { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
      .reader { padding: 24px 16px 120px; }
      .song-sheet { font-size: calc(var(--song-size) - 1px); }
      .playerbar {
        padding: 8px;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      .player-actions { grid-column: 1 / -1; }
      .playerbar audio { grid-column: 1 / -1; }
      .playerbar .hint { display: none; }
      .slider-group { justify-self: stretch; }
      .slider-group input { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-kicker">aktmamut.eu</div>
        <div class="brand-title">Guitar Lab</div>
        <div class="brand-subtitle">SongBook · Stage 1 MVP</div>
      </div>

      <div class="search-wrap">
        <input class="search" id="songSearch" type="search" placeholder="Szukaj utworu lub artysty…" autocomplete="off" />
      </div>

      <ul class="song-list" id="songList"></ul>

      <div class="sidebar-footer">
        Dane utworów są na razie zapisane bezpośrednio w tym pliku HTML. W Etapie 2 przeniesiemy je do edytora i osobnych plików.
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <div class="title-row">
          <button class="btn menu-btn" id="menuBtn" aria-label="Pokaż lub ukryj bibliotekę" title="Pokaż / ukryj bibliotekę">☰</button>
          <div class="song-heading">
            <h1 id="songTitle">—</h1>
            <div class="artist" id="songArtist">—</div>
          </div>
        </div>

        <div class="toolbar">
          <span class="meta-pill">Key <strong id="songKey">—</strong></span>
          <span class="meta-pill">Capo <strong id="songCapo">—</strong></span>

          <div class="control-group" aria-label="Transpozycja">
            <button id="transposeDown" title="Transpose -1">−</button>
            <span class="value" id="transposeValue">Transpose 0</span>
            <button id="transposeUp" title="Transpose +1">+</button>
          </div>

          <div class="segmented" id="viewModes" aria-label="Tryb wyświetlania">
            <button data-mode="all" class="active">All</button>
            <button data-mode="lyrics">Lyrics</button>
            <button data-mode="chords">Chords</button>
            <button data-mode="ipa">IPA</button>
          </div>

          <div class="control-group" aria-label="Rozmiar tekstu">
            <button id="fontDown" title="Mniejszy tekst">A−</button>
            <span class="value" id="fontValue">20 px</span>
            <button id="fontUp" title="Większy tekst">A+</button>
          </div>
        </div>
      </header>

      <section class="reader" id="reader">
        <article class="song-sheet mode-all" id="songSheet"></article>
      </section>

      <footer class="playerbar">
        <div class="player-actions">
          <button class="btn primary" id="scrollToggle">▶ Auto-scroll</button>
          <label class="file-label" title="Plik pozostaje lokalnie w przeglądarce">
            ♪ Wybierz audio
            <input id="audioFile" type="file" accept="audio/*,video/webm,video/mp4" />
          </label>
        </div>

        <audio id="audio" controls preload="metadata"></audio>

        <div class="slider-group">
          <span>Scroll</span>
          <input id="scrollSpeed" type="range" min="1" max="12" step="1" value="4" />
          <strong id="scrollSpeedValue">4</strong>
        </div>

        <div class="hint">Spacja: start/stop scroll · Esc: schowaj bibliotekę</div>
      </footer>
    </main>
  </div>

            lines: [
              { lyric: '[C]This is a [Am]template line', ipa: '⟦ðɪs-ɪz-ə-ˈtɛmpleɪt-laɪn⟧' },
              { lyric: '[F]Add your chords, lyrics and [G]IPA', ipa: '⟦æd-jɚ-kɔrdz | ˈlɪrɪks-ən-aɪ-pi-ˈeɪ⟧' }
            ]
          }
        ]
      }
    ];

    const CHROMATIC_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const FLAT_TO_SHARP = { Db:'C#', Eb:'D#', Gb:'F#', Ab:'G#', Bb:'A#' };
    const NOTE_RE = /^([A-G])([#b]?)(.*)$/;

    const els = {
      app: document.getElementById('app'),
      sidebar: document.getElementById('sidebar'),
      backdrop: document.getElementById('backdrop'),
      menuBtn: document.getElementById('menuBtn'),
      list: document.getElementById('songList'),
      search: document.getElementById('songSearch'),
      title: document.getElementById('songTitle'),
      artist: document.getElementById('songArtist'),
      key: document.getElementById('songKey'),
      capo: document.getElementById('songCapo'),
      transposeValue: document.getElementById('transposeValue'),
      sheet: document.getElementById('songSheet'),
      reader: document.getElementById('reader'),
      modeButtons: [...document.querySelectorAll('#viewModes button')],
      fontValue: document.getElementById('fontValue'),
      scrollToggle: document.getElementById('scrollToggle'),
      scrollSpeed: document.getElementById('scrollSpeed'),
      scrollSpeedValue: document.getElementById('scrollSpeedValue'),
      audioFile: document.getElementById('audioFile'),
      audio: document.getElementById('audio')
    };

    let currentSongId = localStorage.getItem('gl.song') || 'falling';
    let transpose = Number(localStorage.getItem('gl.transpose') || 0);
    let mode = localStorage.getItem('gl.mode') || 'all';
    let fontSize = Number(localStorage.getItem('gl.fontSize') || 20);
    let autoScrollOn = false;
    let scrollRAF = 0;
    let lastTs = 0;
    let audioObjectUrl = null;
    let desktopSidebarCollapsed = localStorage.getItem('gl.sidebarCollapsed') === '1';

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function transposeChord(chord, delta) {
      const m = chord.match(NOTE_RE);
      if (!m) return chord;
      let [, root, accidental, suffix] = m;
      let normalized = root + accidental;
      normalized = FLAT_TO_SHARP[normalized] || normalized;
      let idx = CHROMATIC_SHARP.indexOf(normalized);
      if (idx < 0) return chord;
      idx = (idx + delta + 120) % 12;
      return CHROMATIC_SHARP[idx] + suffix;
    }

    function parseChordProLine(line) {
      const parts = [];
      const re = /\[([^\]]+)\]([^\[]*)/g;
      let match;
      let cursor = 0;

      while ((match = re.exec(line)) !== null) {
        if (match.index > cursor) {
          parts.push({ chord: '', text: line.slice(cursor, match.index) });
        }
        parts.push({ chord: transposeChord(match[1], transpose), text: match[2] });
        cursor = re.lastIndex;
      }

      if (cursor < line.length) parts.push({ chord: '', text: line.slice(cursor) });
      if (!parts.length) parts.push({ chord: '', text: line });
      return parts;
    }

    function renderLyricLine(line) {
      const parts = parseChordProLine(line);
      return parts.map(part => {
        const chord = part.chord ? escapeHtml(part.chord) : '&nbsp;';
        const text = escapeHtml(part.text || ' ');
        return `<span class="unit"><span class="chord">${chord}</span><span class="word">${text}</span></span>`;
      }).join('');
    }

    function renderSongList(filter = '') {
      const q = filter.trim().toLowerCase();
      const items = SONGS.filter(song => `${song.title} ${song.artist}`.toLowerCase().includes(q));
      els.list.innerHTML = items.map(song => `
        <li class="song-item ${song.id === currentSongId ? 'active' : ''}">
          <button data-song-id="${song.id}">
            <div class="song-title-small">${escapeHtml(song.title)}</div>
            <div class="song-artist-small">${escapeHtml(song.artist)}</div>
          </button>
        </li>
      `).join('') || '<li class="empty">Brak wyników</li>';

      els.list.querySelectorAll('[data-song-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentSongId = btn.dataset.songId;
          transpose = 0;
          localStorage.setItem('gl.song', currentSongId);
          localStorage.setItem('gl.transpose', '0');
          renderAll();
          closeSidebar();
        });
      });
    }

    function currentSong() {
      return SONGS.find(song => song.id === currentSongId) || SONGS[0];
    }

    function renderSong() {
      const song = currentSong();
      els.title.textContent = song.title;
      els.artist.textContent = song.artist;
      els.key.textContent = transposeChord(song.key, transpose);
      els.capo.textContent = song.capo;
      els.transposeValue.textContent = `Transpose ${transpose > 0 ? '+' : ''}${transpose}`;

      els.sheet.className = `song-sheet mode-${mode}`;
      els.sheet.innerHTML = song.sections.map(section => `
        <section class="section">
          <h2 class="section-title">${escapeHtml(section.title)}</h2>
          ${section.lines.map(line => `
            <div class="line-block">
              <div class="lyric-line">${renderLyricLine(line.lyric)}</div>
              ${line.ipa ? `<div class="ipa">${escapeHtml(line.ipa)}</div>` : ''}
            </div>
          `).join('')}
        </section>
      `).join('');

      els.modeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      els.reader.scrollTop = 0;
      document.title = `${song.title} — Guitar Lab`;
    }

    function applyFontSize() {
      fontSize = Math.max(14, Math.min(34, fontSize));
      document.documentElement.style.setProperty('--song-size', `${fontSize}px`);
      els.fontValue.textContent = `${fontSize} px`;
      localStorage.setItem('gl.fontSize', String(fontSize));
    }

    function renderAll() {
      renderSongList(els.search.value);
      renderSong();
      applyFontSize();
    }

    function setMode(nextMode) {
      mode = nextMode;
      localStorage.setItem('gl.mode', mode);
      renderSong();
    }

    function changeTranspose(delta) {
      transpose = Math.max(-11, Math.min(11, transpose + delta));
      localStorage.setItem('gl.transpose', String(transpose));
      renderSong();
    }

    function autoScrollFrame(ts) {
      if (!autoScrollOn) return;
      if (!lastTs) lastTs = ts;
      const dt = Math.min(64, ts - lastTs);
      lastTs = ts;
      const speed = Number(els.scrollSpeed.value);
      const pixelsPerSecond = speed * 6;
      els.reader.scrollTop += pixelsPerSecond * (dt / 1000);

      const atBottom = els.reader.scrollTop + els.reader.clientHeight >= els.reader.scrollHeight - 3;
      if (atBottom) {
        stopAutoScroll();
        return;
      }
      scrollRAF = requestAnimationFrame(autoScrollFrame);
    }

    function startAutoScroll() {
      autoScrollOn = true;
      lastTs = 0;
      els.scrollToggle.textContent = '⏸ Auto-scroll';
      scrollRAF = requestAnimationFrame(autoScrollFrame);
    }

    function stopAutoScroll() {
      autoScrollOn = false;
      cancelAnimationFrame(scrollRAF);
      lastTs = 0;
      els.scrollToggle.textContent = '▶ Auto-scroll';
    }

    function toggleAutoScroll() {
      autoScrollOn ? stopAutoScroll() : startAutoScroll();
    }

    function isMobileSidebar() {
      return window.matchMedia('(max-width: 760px)').matches;
    }

    function applyDesktopSidebarState() {
      const collapsed = desktopSidebarCollapsed && !isMobileSidebar();
      els.app.classList.toggle('sidebar-collapsed', collapsed);
      els.menuBtn.setAttribute('aria-expanded', String(!collapsed));
    }

    function openSidebar() {
      els.sidebar.classList.add('open');
      els.backdrop.classList.add('show');
      els.menuBtn.setAttribute('aria-expanded', 'true');
    }

    function closeSidebar() {
      els.sidebar.classList.remove('open');
      els.backdrop.classList.remove('show');
      if (isMobileSidebar()) els.menuBtn.setAttribute('aria-expanded', 'false');
    }

    function toggleSidebar() {
      if (isMobileSidebar()) {
        els.sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
        return;
      }

      desktopSidebarCollapsed = !desktopSidebarCollapsed;
      localStorage.setItem('gl.sidebarCollapsed', desktopSidebarCollapsed ? '1' : '0');
      applyDesktopSidebarState();
    }

    function collapseDesktopSidebar() {
      if (isMobileSidebar()) return;
      desktopSidebarCollapsed = true;
      localStorage.setItem('gl.sidebarCollapsed', '1');
      applyDesktopSidebarState();
    }

    document.getElementById('transposeDown').addEventListener('click', () => changeTranspose(-1));
    document.getElementById('transposeUp').addEventListener('click', () => changeTranspose(1));
    document.getElementById('fontDown').addEventListener('click', () => { fontSize--; applyFontSize(); });
    document.getElementById('fontUp').addEventListener('click', () => { fontSize++; applyFontSize(); });
    els.modeButtons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
    els.search.addEventListener('input', e => renderSongList(e.target.value));
    els.scrollToggle.addEventListener('click', toggleAutoScroll);
    els.scrollSpeed.addEventListener('input', () => {
      els.scrollSpeedValue.textContent = els.scrollSpeed.value;
      localStorage.setItem('gl.scrollSpeed', els.scrollSpeed.value);
    });
    els.menuBtn.addEventListener('click', toggleSidebar);
    els.backdrop.addEventListener('click', closeSidebar);

    els.audioFile.addEventListener('change', () => {
      const file = els.audioFile.files?.[0];
      if (!file) return;
      if (audioObjectUrl) URL.revokeObjectURL(audioObjectUrl);
      audioObjectUrl = URL.createObjectURL(file);
      els.audio.src = audioObjectUrl;
      els.audio.play().catch(() => {});
    });

    window.addEventListener('keydown', e => {
      const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
      if (e.code === 'Space' && !typing) {
        e.preventDefault();
        toggleAutoScroll();
      }
      if (e.key === 'Escape') {
        isMobileSidebar() ? closeSidebar() : collapseDesktopSidebar();
      }
    });

    window.addEventListener('resize', () => {
      closeSidebar();
      applyDesktopSidebarState();
    });

    const savedSpeed = localStorage.getItem('gl.scrollSpeed');
    if (savedSpeed) els.scrollSpeed.value = savedSpeed;
    els.scrollSpeedValue.textContent = els.scrollSpeed.value;

    applyDesktopSidebarState();
    renderAll();
  </script>
</body>
</html>
